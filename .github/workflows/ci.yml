name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (venv + requirements)
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pip install --disable-pip-version-check -q --upgrade pip
          "$PY" -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run unit tests
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pytest -q
      - name: Boot smoke (uvicorn serves static index)
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          MEMPALACE_VIZ_PORT=8766 "$PY" -m server.main >server.log 2>&1 &
          SERVER_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8766/ | grep -q "MemPalace"; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "== boot failed, server.log =="
            cat server.log || true
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "boot OK"
          kill "$SERVER_PID" 2>/dev/null || true
